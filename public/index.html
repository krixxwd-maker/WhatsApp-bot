<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRIX ESHU | Panel</title>
<style>
  body { background: #09090b; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
  .header h1 { color: #00ffcc; text-align: center; margin-bottom: 5px; }
  .status { text-align: center; font-weight: bold; margin-bottom: 20px; }
  .connected { color: #00ffcc; }
  .disconnected { color: #ff3333; }
  .card { background: #18181b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #27272a; }
  h3 { color: #00ffcc; margin-top: 0; }
  input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; box-sizing: border-box; }
  input { background: #000; color: #00ffcc; border: 1px solid #333; }
  button { background: #00ffcc; color: #000; font-weight: bold; cursor: pointer; }
  #code { font-size: 2rem; color: #00ffcc; font-weight: bold; text-align: center; letter-spacing: 5px; margin-top: 10px; }
  input[type="file"] { background: #000; color: #00ffcc; padding: 10px; border: 1px dashed #00ffcc; }
  .msg { font-size: 13px; text-align: center; margin-top: 5px; }
</style>
</head>
<body>
  <div class="header"><h1>KRIX ESHU</h1></div>
  <div id="status" class="status disconnected">Status: Disconnected</div>

  <div class="card">
    <h3>1. Link WhatsApp</h3>
    <input type="text" id="phone" placeholder="Number (e.g. 919876543210)">
    <button onclick="pair()" id="btn-pair">Get Pairing Code</button>
    <div id="code"></div>
  </div>

  <div class="card">
    <h3>2. Upload Shayari (messages.txt)</h3>
    <input type="file" id="msgFile" accept=".txt">
    <button onclick="uploadFile()" id="btn-upload">📁 Upload File</button>
    <div id="upload-status" class="msg"></div>
  </div>

<script>
  async function pair() {
    const phone = document.getElementById('phone').value;
    if(!phone) return alert('Number daalo');
    document.getElementById('btn-pair').innerText = "Generating...";
    await fetch('/api/pair', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ phone }) });
    document.getElementById('btn-pair').innerText = "Get Pairing Code";
  }

  async function checkStatus() {
    const res = await fetch('/api/status');
    const data = await res.json();
    const st = document.getElementById('status');
    if(data.connected) {
      st.innerText = "Status: Connected ✅"; st.className = "status connected";
      document.getElementById('code').innerText = "";
    } else {
      st.innerText = "Status: Disconnected ❌"; st.className = "status disconnected";
      if(data.pairingCode) document.getElementById('code').innerText = data.pairingCode;
    }
  }
  setInterval(checkStatus, 2000); // Har 2 sec me update

  async function uploadFile() {
    const fileInput = document.getElementById('msgFile');
    if (fileInput.files.length === 0) return alert('Pehle .txt file select karo!');
    const formData = new FormData();
    formData.append('msgFile', fileInput.files[0]);
    const statusDiv = document.getElementById('upload-status');
    statusDiv.innerText = "Uploading..."; statusDiv.style.color = "#fff";
    
    try {
      const res = await fetch('/api/upload-msg', { method: 'POST', body: formData });
      const data = await res.json();
      if(data.error) throw new Error(data.error);
      statusDiv.innerText = `✅ Uploaded! (Lines: ${data.count})`; statusDiv.style.color = "#00ffcc";
    } catch (err) {
      statusDiv.innerText = `❌ Error: ${err.message}`; statusDiv.style.color = "#ff3333";
    }
  }
</script>
</body>
</html>
